server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: resolve the "backend" upstream per-request
    # instead of once at config load, so this container starts cleanly
    # even if the backend isn't resolvable yet (startup order, restarts).
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Backend endpoints called by the Angular app with relative URLs
    # (/api, /oauth2/authorization/oidc, /login/oauth2/code/oidc, ...).
    # Proxying them here keeps the browser on a single origin, so the
    # OAuth2 login flow and its session cookie work without any CORS or
    # cross-subdomain cookie configuration.
    location ~ ^/(api|management|oauth2|login|services|v3/api-docs|swagger-ui) {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trust the scheme set by the upstream reverse proxy (Traefik/Dokploy
        # terminates TLS and forwards plain HTTP here); fall back to $scheme
        # for direct/local access.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }

    # Security headers for the Angular pages. Spring Security already sets
    # the equivalent headers on /api/ responses (see SecurityConfiguration),
    # but that only covers requests hitting the backend — everything served
    # directly by this nginx (the SPA itself) needs its own copy. Kept out
    # of the /api/... location above so nothing here duplicates/conflicts
    # with what the backend already sends on its own responses.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), sync-xhr=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com; img-src 'self' data: https://placehold.co https://primefaces.org; font-src 'self' data: https://fonts.gstatic.com https://fonts.cdnfonts.com; connect-src 'self'" always;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
