server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: resolve the "backend" upstream per-request
    # instead of once at config load, so this container starts cleanly
    # even if the backend isn't resolvable yet (startup order, restarts).
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Backend endpoints called by the Angular app with relative URLs
    # (/api, /oauth2/authorization/oidc, /login/oauth2/code/oidc, ...).
    # Proxying them here keeps the browser on a single origin, so the
    # OAuth2 login flow and its session cookie work without any CORS or
    # cross-subdomain cookie configuration.
    location ~ ^/(api|management|oauth2|login|services|v3/api-docs|swagger-ui) {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trust the scheme set by the upstream reverse proxy (Traefik/Dokploy
        # terminates TLS and forwards plain HTTP here); fall back to $scheme
        # for direct/local access.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
